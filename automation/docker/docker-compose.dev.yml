---
# Standalone development environment. Retains the existing blog project
# name so the home_data volume survives rebuilds unchanged.
name: blog
services:

  dev:
    build:
      context: ../..
      dockerfile: automation/docker/Dockerfile.dev
      args:
        RUN_UID: ${HOST_UID:-1000}
        RUN_GID: ${HOST_GID:-1000}
      # Optional BuildKit CA: the tracked empty file makes this a no-op unless
      # APEX_BLOG_BUILD_CA_BUNDLE points to a trusted host PEM bundle.
      secrets:
        - apex_blog_build_ca
    working_dir: /workspace
    environment:
      HOME: /home/vscode
      CI: "true"
      APEX_BLOG_IMAGE_TOOLS: "true"
      # Initialized by prepare_trust.sh before the development shell starts.
      # An empty external directory is valid: public roots remain trusted.
      APEX_BLOG_CUSTOM_CA_DIR: /run/apex-blog/external/certificates
      SSL_CERT_FILE: /tmp/apex-blog-trust/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /tmp/apex-blog-trust/ca-bundle.pem
      CURL_CA_BUNDLE: /tmp/apex-blog-trust/ca-bundle.pem
      GIT_SSL_CAINFO: /tmp/apex-blog-trust/ca-bundle.pem
      NODE_EXTRA_CA_CERTS: /tmp/apex-blog-trust/ca-bundle.pem
      NPM_CONFIG_CAFILE: /tmp/apex-blog-trust/ca-bundle.pem
      PIP_CERT: /tmp/apex-blog-trust/ca-bundle.pem
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/tmp/apex-blog-trust/cacerts
        -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - ../..:/workspace
      # Docker initializes a fresh named volume from /home/vscode in the
      # image. Existing home_data contents are retained without overwrite.
      - home_data:/home/vscode
      # Optional developer-specific saved SQLcl profile, never the MCP profile.
      # The read-only source is synchronized into the persistent home on start.
      - type: bind
        source: ${APEX_BLOG_DEV_SQLCL_PROFILE_DIR:-./placeholders/empty-sqlcl-profile}
        target: /run/sqlcl-profile
        read_only: true
        bind:
          create_host_path: false
      # A developer may provide an external wallet/CA directory. Without one,
      # mount only the tracked, empty placeholder (not the developer's HOME).
      - type: bind
        source: ${APEX_BLOG_EXTERNAL_DIR:-./placeholders/empty-external}
        target: /run/apex-blog/external
        read_only: true
        bind:
          create_host_path: false
    # Linux: share host VPN routes and localhost MCP endpoint, not Docker socket.
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  home_data:

secrets:
  apex_blog_build_ca:
    # No CA file is required unless a corporate proxy needs extra build trust.
    # The empty file is harmless; the actual bundle stays outside Git.
    file: ${APEX_BLOG_BUILD_CA_BUNDLE:-./placeholders/empty-build-ca.pem}
