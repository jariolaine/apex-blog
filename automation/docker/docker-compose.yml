---
name: blog
services:
  tst-db:
    container_name: blog-tst-db
    image: container-registry.oracle.com/database/free:latest
    ports:
      - 127.0.0.1:1521:1521/tcp
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
    volumes:
      - oradata:/opt/oracle/oradata
      - ./apex:/opt/oracle/apex

  tst-ords:
    container_name: blog-tst-ords
    image: container-registry.oracle.com/database/ords:latest
    ports:
      - 127.0.0.1:8181:8080/tcp
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
      - ORACLE_USER_PWD=${ORACLE_PWD}
      - DBHOST=blog-tst-db
      - DBPORT=1521
      - DBSERVICENAME=freepdb1
    volumes:
      - ords-conf:/etc/ords/config
      - ./apex:/opt/oracle/apex
    depends_on:
      tst-db:
        condition: service_healthy

  automation:
    container_name: blog-automation
    build:
      context: ../..
      dockerfile: automation/docker/Dockerfile.automation
      args:
        RUN_UID: ${HOST_UID:-1000}
        RUN_GID: ${HOST_GID:-1000}
    working_dir: /workspace
    restart: unless-stopped
    ports:
      # Local MCP clients only; this endpoint has no remote authentication.
      - 127.0.0.1:8765:8765/tcp
    environment:
      HOME: /home/agent
      CI: "true"
      APEX_BLOG_MCP_CONTAINER: "true"
      AUTOMATION_JOB_DIR: /var/lib/apex-blog/jobs
    volumes:
      - ../..:/workspace
      - automation_venv:/workspace/.venv
      - automation_node_modules:/workspace/node_modules
      - automation_jobs:/var/lib/apex-blog/jobs
      # Dedicated DEV/TEST-only SQLcl profile; copied to private runtime home.
      - ${SQLCL_PROFILE_DIR:?Set SQLCL_PROFILE_DIR}:/run/sqlcl-profile:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  automation_venv:
  automation_node_modules:
  automation_jobs:
  oradata:
  ords-conf:
