---
name: blog
services:
  db-26ai-free:
    container_name: db-26ai-free
    image: container-registry.oracle.com/database/free:latest
    ports:
      - 127.0.0.1:1521:1521/tcp
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
    volumes:
      - oradata:/opt/oracle/oradata
      - ./apex:/opt/oracle/apex

  ords-node-1:
    container_name: ords-node-1
    image: container-registry.oracle.com/database/ords:latest
    ports:
      - 127.0.0.1:8181:8080/tcp
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
      - ORACLE_USER_PWD=${ORACLE_PWD}
      - DBHOST=db-26ai-free
      - DBPORT=1521
      - DBSERVICENAME=freepdb1
    volumes:
      - ords-conf:/etc/ords/config
      - ./apex:/opt/oracle/apex
    depends_on:
      db-26ai-free:
        condition: service_healthy

volumes:
  oradata:
  ords-conf:
