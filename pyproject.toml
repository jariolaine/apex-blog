[tool.ruff]
target-version = "py312"
include = ["automation/**/*.py"]
extend-exclude = ["automation/docker/apex"]

[tool.ruff.lint]
# Start with clear correctness errors rather than reformatting legacy sources.
select = ["E4", "E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
# Test discovery must not pick up files from locally installed Oracle APEX.
addopts = ["--ignore=automation/docker/apex"]
